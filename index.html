<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ankle Deep Games</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="site-header">
      <img
        class="company-logo"
        src="images/AnkleDeepGamesLogo.png"
        alt="Ankle Deep Games"
      />
    </header>

    <main>
      <h1>Our Games</h1>

      <section class="games">
        <article class="game-card">
          <div class="game-image-container">
            <img src="images/MysticTavernLogo.png" alt="Mystic Tavern" />
          </div>

          <h2>Mystic Tavern</h2>
          <p class="coming-soon">Coming Soon!</p>
        </article>

        <article class="game-card">
          <div class="game-image-container">
            <img src="images/ExileLogo.png" alt="EXiLE" />
          </div>

          <h2>EXiLE</h2>
          <p class="coming-soon">Coming Soon!</p>
        </article>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Ankle Deep Games</p>
    </footer>
  </body>
</html>
